{% extends "base.html" %}
{% block title %}Challenges - Tic Tac Toe Online{% endblock %}
{% block content %}
<h1>Challenges</h1>
<p class="muted">
    Invite another player by their exact display name. They'll need to accept before a live game starts.
</p>

<form id="send-challenge-form">
    <div class="field">
        <label for="invitee_name">Challenge someone by name</label>
        <input type="text" id="invitee_name" name="invitee_name" maxlength="20" required
               placeholder="Their display name">
    </div>
    <button type="submit" class="btn">Send challenge</button>
    <p id="send-challenge-error" class="field-error" hidden></p>
</form>

<h2>Incoming</h2>
<ul id="incoming-list" class="list">
    <li class="muted">Loading...</li>
</ul>

<h2>Outgoing</h2>
<ul id="outgoing-list" class="list">
    <li class="muted">Loading...</li>
</ul>
{% endblock %}

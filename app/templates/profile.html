{% extends "base.html" %}
{% block title %}My Stats - Tic Tac Toe Online{% endblock %}
{% block content %}
<h1>My Stats</h1>
<p>Signed in as <strong>{{ profile.display_name }}</strong></p>

<div class="table-wrap">
<table class="table">
    <tbody>
        <tr><th>Wins</th><td>{{ profile.wins }}</td></tr>
        <tr><th>Losses</th><td>{{ profile.losses }}</td></tr>
        <tr><th>Ties</th><td>{{ profile.ties }}</td></tr>
    </tbody>
</table>
</div>

<p><a href="/leaderboard">View leaderboard</a></p>
{% endblock %}

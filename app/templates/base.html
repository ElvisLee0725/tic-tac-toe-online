<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tic Tac Toe Online{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <header class="nav">
        <a class="brand" href="/">Tic Tac Toe Online</a>
        <nav>
            {% if profile %}
                <span class="nav-name">Signed in as <strong>{{ profile.display_name }}</strong></span>
            {% else %}
                <a href="/signin">Sign in</a>
            {% endif %}
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
